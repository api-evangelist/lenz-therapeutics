aid: lenz-therapeutics
name: LENZ Therapeutics
description: >-
  LENZ Therapeutics, Inc. (Nasdaq: LENZ) is a commercial-stage ophthalmic pharmaceutical company
  headquartered in San Diego, California, focused on the commercialization of VIZZ (aceclidine
  ophthalmic solution) 1.44% — the first and only FDA-approved aceclidine-based eye drop for the
  treatment of presbyopia. LENZ commercializes VIZZ in the United States and establishes
  international licensing partnerships to provide access globally. The company publishes no
  developer program, public API, SDK, or machine-readable API description of any kind; its public
  surface is a ten-page WordPress marketing site, a VIZZ product site, and an investor-relations
  portal carrying SEC filings and a press-release RSS feed.
